<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>hello</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: black;
  color: red;
  font-family: "Courier New", monospace;
  overflow: hidden;
}

.screen {
  display: none;
  width: 100%;
  height: 100%;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  position: relative;
}

.active { display: flex; }

.glow {
  text-shadow: 0 0 8px rgba(255,0,0,0.85);
}

.cursor::after {
  content: "▌";
  animation: blink 1s infinite;
}

@keyframes blink {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0; }
}

button {
  position: absolute;
  bottom: 60px;
  padding: 14px 34px;
  background: black;
  border: 1px solid red;
  color: red;
  font-weight: bold;
  font-family: inherit;
  border-radius: 10px;
  cursor: pointer;
  box-shadow: 0 0 14px rgba(255,0,0,0.7);
}

button:hover {
  box-shadow: 0 0 22px rgba(255,0,0,1);
}

#imageContainer {
  position: absolute;
  inset: 0;
}

#imageContainer img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

canvas {
  position: absolute;
  inset: 0;
}

#instruction {
  position: absolute;
  text-align: center;
  z-index: 10;
}

#revealBtn {
  display: none;
}
</style>
</head>

<body>

<!-- SCREEN 1 -->
<div class="screen active" id="s1">
  <div id="helloText" class="glow"></div>
</div>

<!-- SCREEN 2 -->
<div class="screen" id="s2">
  <div id="taskText" class="glow"></div>
</div>

<!-- SCREEN 3 -->
<div class="screen" id="s3">
  <div id="instruction" class="glow"></div>

  <div id="imageContainer">
    <img id="photo" src="pic1.jpg">
    <canvas id="scratch"></canvas>
  </div>

  <button id="revealBtn">want to see more?</button>
</div>

<script>
const screens = document.querySelectorAll(".screen");
const helloText = document.getElementById("helloText");
const taskText = document.getElementById("taskText");
const instruction = document.getElementById("instruction");
const canvas = document.getElementById("scratch");
const ctx = canvas.getContext("2d");
const photo = document.getElementById("photo");
const revealBtn = document.getElementById("revealBtn");

let scratching = false;
let currentPic = 1;
const totalPics = 5;
let instructionText = "baby, please click and drag your mouse across the screen for me";

/* ---------- TYPING ---------- */
function typeAppend(el, text, speed = 70, callback) {
  el.classList.add("cursor");
  let i = 0;
  const interval = setInterval(() => {
    el.textContent += text[i];
    i++;
    if (i >= text.length) {
      clearInterval(interval);
      el.classList.remove("cursor");
      if (callback) callback();
    }
  }, speed);
}

/* ---------- SCREEN 1 ---------- */
typeAppend(helloText, "hello,", 80, () => {
  setTimeout(() => {
    typeAppend(helloText, " abdullah", 80);
  }, 3000);
});

setTimeout(() => {
  const btn = document.createElement("button");
  btn.textContent = "hello";
  btn.onclick = () => {
    showScreen(1);
    startScreen2();
  };
  screens[0].appendChild(btn);
}, 6000);

/* ---------- SCREEN 2 ---------- */
function startScreen2() {
  typeAppend(taskText, "i need you to do something for me...", 70, () => {
    setTimeout(() => {
      typeAppend(taskText, " as always...", 70);
    }, 3000);
  });

  setTimeout(() => {
    const btn = document.createElement("button");
    btn.textContent = "of course baby";
    btn.onclick = () => {
      showScreen(2);
      startScratch();
    };
    screens[1].appendChild(btn);
  }, 6000);
}

/* ---------- SCRATCH ---------- */
function startScratch() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  scratching = false;
  instruction.textContent = "";
  typeAppend(instruction, instructionText, 60);
}

function scratch(x, y) {
  if (!scratching) {
    instruction.textContent = "";
  }
  ctx.globalCompositeOperation = "destination-out";
  ctx.beginPath();
  ctx.arc(x, y, 36, 0, Math.PI * 2);
  ctx.fill();
  checkReveal();
}

/* Mouse */
canvas.onmousedown = () => scratching = true;
canvas.onmouseup = () => scratching = false;
canvas.onmousemove = e => {
  if (!scratching) return;
  scratch(e.clientX, e.clientY);
};

/* Touch */
canvas.ontouchstart = () => scratching = true;
canvas.ontouchend = () => scratching = false;
canvas.ontouchmove = e => {
  if (!scratching) return;
  scratch(e.touches[0].clientX, e.touches[0].clientY);
};

/* ---------- REVEAL ---------- */
function checkReveal() {
  const data = ctx.getImageData(0,0,canvas.width,canvas.height).data;
  let cleared = 0;
  for (let i = 3; i < data.length; i += 4) {
    if (data[i] === 0) cleared++;
  }
  if (cleared / (data.length / 4) > 0.6) {
    revealBtn.style.display = "block";
  }
}

/* ---------- BUTTON ---------- */
revealBtn.onmouseenter = () => revealBtn.textContent = "yes";
revealBtn.onmouseleave = () => revealBtn.textContent = "want to see more?";

revealBtn.onclick = () => {
  currentPic++;

  if (currentPic > totalPics) {
    revealBtn.textContent = "happy valentines day ;)";
    revealBtn.onmouseenter = null;
    revealBtn.onmouseleave = null;
    revealBtn.onclick = () => location.reload();
    return;
  }

  instructionText = "click and drag your mouse again ;)";
  photo.src = `pic${currentPic}.jpg`;
  revealBtn.style.display = "none";
  startScratch();
};

/* ---------- UTIL ---------- */
function showScreen(i) {
  screens.forEach(s => s.classList.remove("active"));
  screens[i].classList.add("active");
}
</script>

</body>
</html>
