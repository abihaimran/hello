<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>hello</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: black;
  color: red;
  font-family: "Courier New", monospace;
  overflow: hidden;
}

.screen {
  display: none;
  width: 100%;
  height: 100%;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  position: relative;
}

.active {
  display: flex;
}

.glow {
  text-shadow: 0 0 8px rgba(255,0,0,0.85);
}

button {
  margin-top: 30px;
  padding: 14px 34px;
  background: black;
  border: 1px solid red;
  color: red;
  font-weight: bold;
  font-family: inherit;
  border-radius: 10px;
  cursor: pointer;
  box-shadow: 0 0 14px rgba(255,0,0,0.7);
}

button:hover {
  box-shadow: 0 0 22px rgba(255,0,0,1);
}

#imageContainer {
  position: absolute;
  inset: 0;
}

#imageContainer img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

canvas {
  position: absolute;
  inset: 0;
}

#revealBtn {
  position: absolute;
  bottom: 60px;
  display: none;
}
</style>
</head>

<body>

<!-- SCREEN 1 -->
<div class="screen active" id="s1">
  <div id="helloText" class="glow">hello,</div>
</div>

<!-- SCREEN 2 -->
<div class="screen" id="s2">
  <div id="taskText" class="glow"></div>
</div>

<!-- SCREEN 3 -->
<div class="screen" id="s3">
  <div class="glow" style="position:absolute; top:40px; z-index:10;">
    baby, please click and drag your mouse across the screen for me
  </div>

  <div id="imageContainer">
    <img id="photo" src="pic1.jpg">
    <canvas id="scratch"></canvas>
  </div>

  <button id="revealBtn">want to see more?</button>
</div>

<script>
const screens = document.querySelectorAll(".screen");
const helloText = document.getElementById("helloText");
const taskText = document.getElementById("taskText");
const canvas = document.getElementById("scratch");
const ctx = canvas.getContext("2d");
const photo = document.getElementById("photo");
const revealBtn = document.getElementById("revealBtn");

let scratching = false;
let currentPic = 1;
const totalPics = 5;

/* ---------- SCREEN 1 ---------- */
setTimeout(() => {
  helloText.textContent = "hello, abdullah";
}, 3000);

setTimeout(() => {
  const btn = document.createElement("button");
  btn.textContent = "hello";
  btn.onclick = () => {
    showScreen(1);
    startScreen2();
  };
  screens[0].appendChild(btn);
}, 6000);

/* ---------- SCREEN 2 ---------- */
function startScreen2() {
  taskText.textContent = "i need you to do something for me...";

  setTimeout(() => {
    taskText.textContent += " as always...";
  }, 3000);

  setTimeout(() => {
    const btn = document.createElement("button");
    btn.textContent = "of course baby";
    btn.onclick = () => {
      showScreen(2);
      startScratch();
    };
    screens[1].appendChild(btn);
  }, 6000);
}

/* ---------- SCRATCH ---------- */
function startScratch() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  scratching = false;
}

function scratch(x, y) {
  ctx.globalCompositeOperation = "destination-out";
  ctx.beginPath();
  ctx.arc(x, y, 36, 0, Math.PI * 2);
  ctx.fill();
  checkReveal();
}

/* Mouse */
canvas.onmousedown = () => scratching = true;
canvas.onmouseup = () => scratching = false;
canvas.onmousemove = e => {
  if (!scratching) return;
  scratch(e.clientX, e.clientY);
};

/* Touch (iPhone) */
canvas.ontouchstart = () => scratching = true;
canvas.ontouchend = () => scratching = false;
canvas.ontouchmove = e => {
  if (!scratching) return;
  const t = e.touches[0];
  scratch(t.clientX, t.clientY);
};

/* ---------- REVEAL CHECK ---------- */
function checkReveal() {
  const data = ctx.getImageData(0,0,canvas.width,canvas.height).data;
  let cleared = 0;

  for (let i = 3; i < data.length; i += 4) {
    if (data[i] === 0) cleared++;
  }

  if (cleared / (data.length / 4) > 0.6) {
    revealBtn.style.display = "block";
  }
}

/* ---------- BUTTON ---------- */
revealBtn.onmouseenter = () => revealBtn.textContent = "yes";
revealBtn.onmouseleave = () => revealBtn.textContent = "want to see more?";

revealBtn.onclick = () => {
  currentPic++;

  if (currentPic > totalPics) {
    revealBtn.textContent = "happy valentines day ;)";
    revealBtn.onmouseenter = null;
    revealBtn.onmouseleave = null;
    revealBtn.onclick = () => location.reload();
    return;
  }

  photo.src = `pic${currentPic}.jpg`;
  revealBtn.style.display = "none";
  startScratch();
};

/* ---------- UTILITY ---------- */
function showScreen(i) {
  screens.forEach(s => s.classList.remove("active"));
  screens[i].classList.add("active");
}
</script>

</body>
</html>
