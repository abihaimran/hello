<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>hello</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: black;
  color: red;
  font-family: "Courier New", monospace;
  overflow: hidden;
}

.screen {
  display: none;
  width: 100%;
  height: 100%;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  position: relative;
}

.active {
  display: flex;
}

.glow {
  text-shadow: 0 0 8px rgba(255,0,0,0.8);
}

button {
  margin-top: 30px;
  padding: 14px 32px;
  background: black;
  border: 1px solid red;
  color: red;
  font-weight: bold;
  font-family: inherit;
  border-radius: 10px;
  cursor: pointer;
  box-shadow: 0 0 12px rgba(255,0,0,0.6);
}

button:hover {
  box-shadow: 0 0 18px rgba(255,0,0,1);
}

#imageContainer {
  position: absolute;
  inset: 0;
}

#imageContainer img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

canvas {
  position: absolute;
  inset: 0;
}

#revealBtn {
  position: absolute;
  bottom: 60px;
  display: none;
}
</style>
</head>

<body>

<!-- SCREEN 1 -->
<div class="screen active" id="s1">
  <div id="hello" class="glow">hello,</div>
</div>

<!-- SCREEN 2 -->
<div class="screen" id="s2">
  <div id="taskText" class="glow">i need you to do something for me...</div>
</div>

<!-- SCREEN 3 (REVEAL LOOP) -->
<div class="screen" id="s3">
  <div class="glow" style="position:absolute; top:40px;">
    please click and drag your cursor across the screen
  </div>

  <div id="imageContainer">
    <img id="photo" src="pic1.jpg">
    <canvas id="scratch"></canvas>
  </div>

  <button id="revealBtn">want to see more?</button>
</div>

<script>
const screens = [...document.querySelectorAll(".screen")];
const hello = document.getElementById("hello");
const taskText = document.getElementById("taskText");
const btnReveal = document.getElementById("revealBtn");
const canvas = document.getElementById("scratch");
const ctx = canvas.getContext("2d");
const photo = document.getElementById("photo");

let currentPic = 1;
const totalPics = 5;

/* ---------- SCREEN 1 ---------- */
setTimeout(() => hello.textContent = "hello, abdullah", 3000);

setTimeout(() => {
  const b = document.createElement("button");
  b.textContent = "hello";
  b.onclick = () => show(1);
  screens[0].appendChild(b);
}, 6000);

/* ---------- SCREEN 2 ---------- */
setTimeout(() => {
  taskText.textContent += " as always...";
}, 3000);

setTimeout(() => {
  const b = document.createElement("button");
  b.textContent = "of course baby";
  b.onclick = () => {
    show(2);
    startScratch();
  };
  screens[1].appendChild(b);
}, 6000);

/* ---------- SCRATCH LOGIC ---------- */
function startScratch() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "black";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  let scratching = false;

  canvas.onmousedown = () => scratching = true;
  canvas.onmouseup = () => scratching = false;
  canvas.onmousemove = e => {
    if (!scratching) return;
    ctx.globalCompositeOperation = "destination-out";
    ctx.beginPath();
    ctx.arc(e.clientX, e.clientY, 35, 0, Math.PI * 2);
    ctx.fill();
    checkReveal();
  };
}

function checkReveal() {
  const data = ctx.getImageData(0,0,canvas.width,canvas.height).data;
  let cleared = 0;
  for (let i = 3; i < data.length; i += 4) {
    if (data[i] === 0) cleared++;
  }

  if (cleared / (data.length / 4) > 0.6) {
    btnReveal.style.display = "block";
  }
}

/* ---------- BUTTON BEHAVIOUR ---------- */
btnReveal.onmouseenter = () => btnReveal.textContent = "yes";
btnReveal.onmouseleave = () => btnReveal.textContent = "want to see more?";

btnReveal.onclick = () => {
  currentPic++;
  if (currentPic > totalPics) {
    btnReveal.textContent = "happy valentines day ;)";
    btnReveal.onmouseenter = null;
    btnReveal.onmouseleave = null;
    btnReveal.onclick = () => location.reload();
    return;
  }

  photo.src = `pic${currentPic}.jpg`;
  btnReveal.style.display = "none";
  startScratch();
};

/* ---------- UTILS ---------- */
function show(i) {
  screens.forEach(s => s.classList.remove("active"));
  screens[i].classList.add("active");
}
</script>

</body>
</html>
